name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug -Darch=arm64
          else
            gradle assembleDebug -Darch=arm64
          fi

      - name: Sign APK
        run: |
          # Cari APK yang dihasilkan
          APK=$(find . -name "*.apk" -path "*/debug/*" | head -n 1)
          echo "Found APK: $APK"
          
          # Sign dengan debug keystore
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            "$APK" androiddebugkey
          
          # Align
          zipalign -v 4 "\( APK" " \){APK%.apk}-signed.apk" || cp "\( APK" " \){APK%.apk}-signed.apk"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VeyrLauncher-debug-signed
          path: |
            **/*-signed.apk
            **/build/outputs/apk/debug/*.apk
