name: Build VeyrLauncher (debug, arm64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK licenses and NDK r25
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build arm64 debug APK
        run: |
          chmod +x gradlew
          ./gradlew :ZalithLauncher:assembleDebug -Darch=arm64 --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VeyrLauncher-debug-arm64
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
